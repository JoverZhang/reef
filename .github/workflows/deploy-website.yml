name: Deploy Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CI: "true"
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable Corepack
        run: corepack enable

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Write configuration
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlsplit, parse_qsl, unquote

          from reef.core import parse_config_yaml, parse_config, write_config

          payload = os.environ.get("CONFIG_YAML", "")
          try:
              document = parse_config_yaml(payload)
              if "ssh_private_key" in document:
                  raise ValueError
              config = parse_config(document)
          except Exception:
              raise SystemExit("CONFIG_YAML must contain valid website configuration without ssh_private_key")

          # A multiline Secret does not cover every extracted/transformed value.
          masks = {payload, *payload.splitlines()}
          def mask_values(value):
              if isinstance(value, str):
                  masks.add(value)
              elif isinstance(value, dict):
                  for item in value.values():
                      mask_values(item)
              elif isinstance(value, list):
                  for item in value:
                      mask_values(item)
          mask_values(document)
          for value in config.upstream_urls:
              url = urlsplit(value)
              masks.update(unquote(part) for part in url.path.split("/") if part)
              masks.update(v for _, v in parse_qsl(url.query))
              masks.update(unquote(part) for part in (url.username, url.password) if part)
          for value in sorted(masks):
              if value:
                  escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::add-mask::" + escaped, flush=True)
          write_config(document, Path("config.yaml"))
          PY

      - name: Install Vercel CLI
        run: npm install --global vercel@54.21.0

      - name: Pull Vercel project
        run: vercel pull --yes --environment=production

      - name: Build
        run: |
          set -euo pipefail
          umask 077
          mkdir -p build
          # Compiler diagnostics can quote generated source containing node credentials.
          if ! vercel build --prod > build/website-build.log 2>&1; then
            echo "Website build failed; detailed output withheld because it may contain subscription credentials"
            exit 1
          fi
          echo "Website build succeeded"

      - name: Deploy
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod

      - name: Remove private build inputs
        if: always()
        run: rm -f config.yaml .vercel/.env*.local build/website-build.log
