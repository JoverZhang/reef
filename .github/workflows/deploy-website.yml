name: Deploy Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CI: "true"
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable Corepack
        run: corepack enable

      - name: Write Reef environment
        env:
          REEF_WEB_ENV: ${{ secrets.REEF_WEB_ENV }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit, parse_qsl, unquote

          payload = os.environ.get("REEF_WEB_ENV", "")
          values = {}
          for raw in payload.splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              key, separator, value = line.partition("=")
              key, value = key.strip(), value.strip()
              if not separator or key in values or not re.fullmatch(
                  r"REEF_(SECRET|ENTRY_PORT_BASE|EXIT_PORT|ENTRY_OVERRIDE_BASE_DOMAIN|"
                  r"ENTRY_[1-9][0-9]*|EXIT_[1-9][0-9]*|UPSTREAM_URL(?:_[1-9][0-9]*)?)", key
              ):
                  raise SystemExit("REEF_WEB_ENV contains an invalid, duplicate, or non-website variable")
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                  value = value[1:-1]
              values[key] = value
          if not values.get("REEF_SECRET"):
              raise SystemExit("REEF_WEB_ENV must contain REEF_SECRET")

          # A multiline GitHub Secret does not cover every extracted/transformed value.
          masks = set(values.values())
          for key, value in values.items():
              if key.startswith("REEF_UPSTREAM_URL"):
                  try:
                      url = urlsplit(value)
                      masks.update(unquote(part) for part in url.path.split("/") if part)
                      masks.update(v for _, v in parse_qsl(url.query))
                      masks.update(filter(None, (url.username, url.password)))
                  except ValueError:
                      raise SystemExit("REEF_WEB_ENV contains an invalid upstream URL")
          for value in sorted(masks):
              if value:
                  escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::add-mask::" + escaped, flush=True)
          path = Path(".env")
          path.touch(mode=0o600, exist_ok=True)
          path.chmod(0o600)
          path.write_text(payload + "\n")
          PY

      - name: Install Vercel CLI
        run: npm install --global vercel@54.21.0

      - name: Pull Vercel project
        run: vercel pull --yes --environment=production

      - name: Build
        run: |
          set -euo pipefail
          umask 077
          mkdir -p build
          # Compiler diagnostics can quote generated source containing node credentials.
          if ! vercel build --prod > build/website-build.log 2>&1; then
            echo "Website build failed; detailed output withheld because it may contain subscription credentials"
            exit 1
          fi
          echo "Website build succeeded"

      - name: Deploy
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod

      - name: Remove local environment files
        if: always()
        run: rm -f .env .vercel/.env*.local build/website-build.log
