# All names, addresses, ports, and credentials below are fictional placeholders.
# Copy the relevant sections into private config.yaml and fill in your values.
# Preserve the existing secret and cluster section when migrating.
# Run `just urls mihomo` for a local preview or `just web-deploy` to publish.
secret: "replace_with_64_lowercase_hex_chars"

proxy-providers:
  pool-a:
    type: http
    upstreams:
      - &source_a {name: source-a, url: "https://source-a.example.invalid/subscription"}
      - &source_b {name: source-b, url: "https://source-b.example.invalid/subscription"}
    filter: "Sample-A|Sample-B"
    exclude-filter: "Sample-Excluded"

  pool-b:
    type: http
    upstreams:
      - &source_c {name: source-c, url: "https://source-c.example.invalid/subscription"}
    filter: "Sample-A|Sample-B"
    exclude-filter: "Sample-Excluded"

  # Combined membership is explicit; this name has no special meaning.
  pool-c:
    type: http
    upstreams: [*source_a, *source_b, *source_c]
    filter: "Sample-A|Sample-B"
    exclude-filter: "Sample-Excluded"

  # Share credentials, but give direct and relayed paths distinct node names.
  exit-a-direct:
    type: inline
    override:
      additional-suffix: " | DIRECT"
    payload: &exit_a_nodes
      - name: "Endpoint A | VLESS"
        type: vless
        server: endpoint-a.example.invalid
        port: 8443
        uuid: 00000000-0000-4000-8000-000000000001
        network: tcp
        tls: true
        servername: tls-a.example.invalid
        client-fingerprint: chrome
        flow: xtls-rprx-vision
        reality-opts:
          public-key: "replace_with_endpoint_a_reality_public_key"
          short-id: ""

  exit-a-relay:
    type: inline
    payload: *exit_a_nodes
    override:
      additional-suffix: " | RELAY"
      dialer-proxy: "RELAY | A"

  exit-b-direct:
    type: inline
    override:
      additional-suffix: " | DIRECT"
    payload: &exit_b_nodes
      - name: "Endpoint B | Trojan"
        type: trojan
        server: endpoint-b.example.invalid
        port: 9443
        password: "replace_with_endpoint_b_trojan_password"
        sni: tls-b.example.invalid
        skip-cert-verify: false
        # For a self-signed certificate, supply its SHA-256 pin:
        # fingerprint: "replace_with_64_hex_certificate_fingerprint"
      - name: "Endpoint B | Hysteria2"
        type: hysteria2
        server: endpoint-b.example.invalid
        port: 9443
        password: "replace_with_endpoint_b_hysteria2_password"
        sni: tls-b.example.invalid
        skip-cert-verify: false
        udp: true

  exit-b-relay:
    type: inline
    payload: *exit_b_nodes
    override:
      additional-suffix: " | RELAY"
      dialer-proxy: "RELAY | B"

proxy-groups:
  # Choose an exit path or use a subscription pool as the final exit.
  - name: PROXY
    type: select
    proxies:
      - "EXIT | A | RELAY"
      - "EXIT | A | DIRECT"
      - "EXIT | B | RELAY"
      - "EXIT | B | DIRECT"
      - "POOL | A"
      - "POOL | B"
      - "POOL | C"

  # Protocol selection and probe history are independent for each path.
  - name: "EXIT | A | RELAY"
    type: url-test
    use: [exit-a-relay]
  - name: "EXIT | A | DIRECT"
    type: url-test
    use: [exit-a-direct]
  - name: "EXIT | B | RELAY"
    type: url-test
    use: [exit-b-relay]
  - name: "EXIT | B | DIRECT"
    type: url-test
    use: [exit-b-direct]

  # Each relayed exit remembers its own pool choice.
  - name: "RELAY | A"
    type: select
    proxies: ["POOL | A", "POOL | B", "POOL | C"]
  - name: "RELAY | B"
    type: select
    proxies: ["POOL | A", "POOL | B", "POOL | C"]

  # The same pool can be an intermediate or a final exit.
  - name: "POOL | A"
    type: url-test
    use: [pool-a]
  - name: "POOL | B"
    type: url-test
    use: [pool-b]
  - name: "POOL | C"
    type: url-test
    use: [pool-c]

# Shared pools share their selected node across every reference.
# DIRECT exit groups connect to the exit server without an intermediate.
# Relays must support the exit transport, including UDP for Hysteria2.
# Avoid include-all in relay groups: including exits can create a cycle.
# QX relay conversion is pending. Publishing updates both Mihomo subscriptions;
# the QX URL returns HTTP 503 until a compatible configuration is published.
