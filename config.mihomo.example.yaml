# Copy the relevant sections into private config.yaml and fill in credentials.
# Run `just urls mihomo` for a local preview or `just web-deploy` to publish.
# Keep the existing secret and cluster section when migrating an installation.
secret: "replace_with_64_lowercase_hex_chars"

proxy-providers:
  xq:
    type: http
    upstreams:
      - &xq {name: xq, url: "https://xq.example.com/private-clash-url"}
      - &xq2 {name: xq2, url: "https://xq2.example.com/private-clash-url"}
    filter: "Hong Kong|Singapore|Japan"
    exclude-filter: "Remaining|Expires|Traffic"

  lx:
    type: http
    upstreams:
      - &lx {name: lx, url: "https://lx.example.com/private-clash-url"}
    filter: "Hong Kong|Singapore|Japan"
    exclude-filter: "Remaining|Expires|Traffic"

  # An ordinary collection: list each upstream explicitly, in any combination.
  # Reuse the same names to keep node identities consistent across collections.
  all:
    type: http
    upstreams: [*xq, *xq2, *lx]
    filter: "Hong Kong|Singapore|Japan"
    exclude-filter: "Remaining|Expires|Traffic"

  exits:
    type: inline
    payload:
      - name: "US Los Angeles | MEGABOX"
        type: vless
        server: megabox.example.com
        port: 8881
        uuid: 00000000-0000-4000-8000-000000000001
        network: tcp
        tls: true
        servername: addons.mozilla.org
        client-fingerprint: chrome
        flow: xtls-rprx-vision
        reality-opts:
          public-key: "replace_with_server_reality_public_key"
          short-id: ""
        dialer-proxy: RELAY-MEGABOX
      - name: "SG Singapore 1 | Alibaba Cloud"
        type: trojan
        server: sg1.example.com
        port: 443
        password: "replace_with_deployed_sg1_trojan_password"
        sni: sg1.example.com
        skip-cert-verify: false
        # For a self-signed certificate, supply its SHA-256 pin:
        # fingerprint: "replace_with_64_hex_certificate_fingerprint"
        dialer-proxy: RELAY-sg1
      - name: "SG Singapore 2 | Alibaba Cloud"
        type: trojan
        server: sg2.example.com
        port: 443
        password: "replace_with_deployed_sg2_trojan_password"
        sni: sg2.example.com
        skip-cert-verify: false
        dialer-proxy: RELAY-sg2

proxy-groups:
  # The selected exit determines the public IP seen by the destination.
  - name: PROXY
    type: select
    use: [exits]

  # Each exit remembers its own intermediate collection choice.
  - name: RELAY-MEGABOX
    type: select
    proxies: [all, xq, lx]
  - name: RELAY-sg1
    type: select
    proxies: [all, xq, lx]
  - name: RELAY-sg2
    type: select
    proxies: [all, xq, lx]

  # Keep these groups visible for automatic selection or pinning in the client.
  # url-test defaults: gstatic generate_204, interval 300, timeout 5000,
  # tolerance 50, lazy true. Set native fields here to override them.
  - name: xq
    type: url-test
    use: [xq]
  - name: lx
    type: url-test
    use: [lx]
  - name: all
    type: url-test
    use: [all]

# For a fixed intermediate, set an exit's dialer-proxy to "xq | actual node name".
# Shared automatic groups share their selected node across exits that use them.
# Avoid include-all in relay groups: including exits can create a cycle.
# HTTP providers can also supply exits with override.dialer-proxy.
# QX relay conversion is pending. Publishing updates both Mihomo subscriptions;
# the QX URL returns HTTP 503 until a compatible configuration is published.
