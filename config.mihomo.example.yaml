# All names, addresses, ports, and credentials below are fictional placeholders.
# Copy the relevant sections into private config.yaml and fill in your values.
# Preserve the existing secret and cluster section when migrating.
# Run `just web-dev` for a local preview or `just web-deploy` to publish.
secret: "replace_with_64_lowercase_hex_chars"
web:
  password: "replace-with-an-independent-random-access-key"

proxy-providers:
  pool-a:
    type: http
    upstreams:
      - &source_a {name: source-a, url: "https://source-a.example.invalid/subscription"}
      - &source_b {name: source-b, url: "https://source-b.example.invalid/subscription"}
    filter: "Sample-A|Sample-B"
    exclude-filter: "Sample-Excluded"

  pool-b:
    type: http
    upstreams:
      - &source_c {name: source-c, url: "https://source-c.example.invalid/subscription"}
    filter: "Sample-A|Sample-B"
    exclude-filter: "Sample-Excluded"

  # Combined membership is explicit; this name has no special meaning.
  pool-c:
    type: http
    upstreams: [*source_a, *source_b, *source_c]
    filter: "Sample-A|Sample-B"
    exclude-filter: "Sample-Excluded"

  # The provider key is the display name used by DIRECT and RELAY paths.
  Endpoint A:
    type: inline
    payload:
      - name: VLESS
        type: vless
        server: endpoint-a.example.invalid
        port: 8443
        uuid: 00000000-0000-4000-8000-000000000001
        network: tcp
        tls: true
        servername: tls-a.example.invalid
        client-fingerprint: chrome
        flow: xtls-rprx-vision
        reality-opts:
          public-key: "replace_with_endpoint_a_reality_public_key"
          short-id: ""

  Endpoint B:
    type: inline
    payload:
      - name: Trojan
        type: trojan
        server: endpoint-b.example.invalid
        port: 9443
        password: "replace_with_endpoint_b_trojan_password"
        sni: tls-b.example.invalid
        skip-cert-verify: false
        # For a self-signed certificate, supply its SHA-256 pin:
        # fingerprint: "replace_with_64_hex_certificate_fingerprint"
      - name: Hysteria2
        type: hysteria2
        server: endpoint-b.example.invalid
        port: 9443
        password: "replace_with_endpoint_b_hysteria2_password"
        sni: tls-b.example.invalid
        skip-cert-verify: false
        udp: true

# Every exit is paired with every pool. Names follow provider display names.
# Keep pool IDs stable: include1 always filters pool-a, regardless of map order.
exits: [Endpoint A, Endpoint B]
pools:
  1: pool-a
  2: pool-b
  3: pool-c

# PROXY offers RELAY | Endpoint A | pool-a, pool-b, pool-c, then DIRECT | Endpoint A.
# Each Endpoint A path is a single proxy, without an extra group.
# Endpoint B paths follow the same naming rule and use automatic protocol groups.
# Each RELAY path points directly to its POOL; PROXY is the only manual selector.
# POOL | pool-a, POOL | pool-b, and POOL | pool-c also appear in PROXY as exits.
# Shared pools share their selected node across every reference.
# DIRECT paths connect to the exit server without an intermediate.
# Relays must support the exit transport, including UDP for Hysteria2.
# Avoid include-all in relay groups: including exits can create a cycle.
# QX uses Reef -> EXIT, RELAY -> pool/direct, and shared automatic POOL policies.
# Unsupported protocols are omitted; an empty compatible exit or pool blocks QX export.
# Preview: /?password=KEY&type=clash-geo&include1=Alpha,Beta
# Export: /dump?password=KEY&type=clash-geo&include1=Alpha,Beta
