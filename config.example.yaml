#      - name: own-trojan
#        type: trojan
#        server: proxy.example.com
#        port: 8443
#        password: "replace_with_server_password"
#        sni: proxy.example.com

# The three fixed profiles route through PROXY. Rules/DNS stay in the templates.
# Omitting proxy-groups and relay keeps the existing PROXY/AUTO defaults.
proxy-groups:
  - name: PROXY
    type: select
    proxies: [AUTO]
    include-all: true
  - name: AUTO
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    tolerance: 50
    lazy: true

# To select collections explicitly, replace include-all with:
#    use: [pool-a, owned]
# First-version provider/group options are listed in docs/DESIGN.md.
# For independently selectable intermediate and exit nodes, see
# config.mihomo.example.yaml. Its relay mapping replaces explicit proxy-groups
# and derives EXIT/RELAY names from endpoint providers. Preview: `just urls mihomo`.
# HTTP collections can replace url with upstreams: [{name: source, url: ...}].
# Each source name adds a "source | " prefix to its nodes.
# Existing subscriptions.upstream_urls / subscriptions.nodes still work, but
# cannot be mixed with the native keys above.

# CI: `just config-yaml` prints the payload for the CONFIG_YAML GitHub Secret.
